; Optional standalone Supervisor 4.x configuration for Linux.
; Adjust paths and the fixed batch ID. Run supervisord as the collection account.
[unix_http_server]
file=/var/lib/ctrip-crawler/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
umask=077
pidfile=/var/lib/ctrip-crawler/supervisord.pid
logfile=/var/lib/ctrip-crawler/supervisord.log
childlogdir=/var/lib/ctrip-crawler

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/lib/ctrip-crawler/supervisor.sock

[program:ctrip-crawler]
directory=/opt/ctrip-crawler
command=/opt/ctrip-crawler/.venv/bin/python /opt/ctrip-crawler/ctrip_flights_scraper.py --output /var/lib/ctrip-crawler/data --run-id batch-001
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
exitcodes=0,2,3,4,130
; Classify immediate application exits by exitcodes, including preflight failures.
startsecs=0
startretries=3
stopsignal=TERM
stopasgroup=false
killasgroup=true
; Covers the default longest operation (900 seconds) and bounded cleanup.
stopwaitsecs=960
stdout_logfile=/var/lib/ctrip-crawler/crawler.stdout.log
stderr_logfile=/var/lib/ctrip-crawler/crawler.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=9
stderr_logfile_backups=9
